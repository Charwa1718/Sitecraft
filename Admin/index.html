<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitecraft Admin</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#e5eaf2;--text:#1c2435;--muted:#66788f;--blue:#4169e1;--blue-soft:#eaf1ff;--green:#1f9d63;--green-soft:#eafaf2;--red:#c93d4d;--red-soft:#fff0f2;--amber:#f7a11a;--amber-soft:#fff7ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(400px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:30px;box-shadow:0 18px 40px #1c24351a}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:24px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,#eef3ff,#dfeaff)}h1{margin:0 0 8px}.muted{color:var(--muted)}input{width:100%;padding:12px;border:1px solid #d5ddea;border-radius:9px;font:inherit;margin:12px 0}.btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.success{background:var(--green-soft);border-color:#cfeee0;color:var(--green)}.danger{background:var(--red-soft);border-color:#f7d3d9;color:var(--red)}.full{width:100%}.error{min-height:20px;color:var(--red);font-weight:700;margin-top:10px}.admin{display:none}.admin.show{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid var(--line);padding:24px 18px}.nav{display:block;width:100%;padding:11px 12px;border:0;border-radius:9px;background:var(--blue-soft);color:var(--blue);text-align:left;font-weight:700}.content{padding:30px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h2{margin:0;font-size:30px}.pill{padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800;background:var(--green-soft);color:var(--green)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:22px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px #1c24350d}.card{padding:18px}.metric{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:800}.value{font-size:30px;font-weight:800;margin-top:10px}.panel{overflow:hidden}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:18px;font-weight:800}.list{padding:12px}.request{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}.request-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.request h3{margin:0 0 6px}.request p{white-space:pre-wrap;color:var(--muted);line-height:1.55}.tag{font-size:11px;padding:6px 9px;border-radius:999px;font-weight:800}.pending{background:var(--amber-soft);color:var(--amber)}.approved{background:var(--green-soft);color:var(--green)}.rejected{background:var(--red-soft);color:var(--red)}.actions{display:flex;gap:8px}.empty{text-align:center;color:var(--muted);padding:24px}@media(max-width:700px){.admin.show{display:block}.sidebar{display:none}.content{padding:18px}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="brand-mark">🛠️</div>Sitecraft Admin</div><h1>Admin access</h1><p class="muted">Enter the admin code to approve update requests.</p><input id="adminCode" type="password" placeholder="Admin code" autocomplete="off"><button class="btn primary full" onclick="login()">Continue</button><div id="loginError" class="error"></div></div></div>
<div id="admin" class="admin"><aside class="sidebar"><div class="brand"><div class="brand-mark">🛠️</div>Sitecraft</div><button class="nav">Approvals</button></aside><main class="content"><div class="topbar"><h2>Admin</h2><div class="pill">Update moderation</div></div><div class="cards"><div class="card"><div class="metric">Pending</div><div class="value" id="pendingCount">0</div></div><div class="card"><div class="metric">Approved</div><div class="value" id="approvedCount">0</div></div><div class="card"><div class="metric">Rejected</div><div class="value" id="rejectedCount">0</div></div></div><section class="panel"><div class="panel-head"><span>Update requests</span><button class="btn primary" onclick="addSample()">Add sample</button></div><div id="requestList" class="list"></div></section></main></div>
<script>
const ADMIN_CODE='admin',REQUEST_KEY='sitecraft-admin-requests';
function login(){if(document.getElementById('adminCode').value.trim()===ADMIN_CODE){sessionStorage.setItem('sitecraft-admin-auth','yes');showAdmin()}else document.getElementById('loginError').textContent='Incorrect admin code'}
function showAdmin(){document.getElementById('login').style.display='none';document.getElementById('admin').classList.add('show');render()}
function requests(){try{return JSON.parse(localStorage.getItem(REQUEST_KEY)||'[]')}catch{return[]}}
function save(x){localStorage.setItem(REQUEST_KEY,JSON.stringify(x))}
function addSample(){const x=requests();x.push({id:Date.now(),title:'Website update request v27',status:'pending',body:'Requested version: 27\nPlease review and approve this update.'});save(x);render()}
function approve(id){const x=requests().map(r=>r.id===id?{...r,status:'approved'}:r);save(x);render()}
function reject(id){const x=requests().map(r=>r.id===id?{...r,status:'rejected'}:r);save(x);render()}
function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const x=requests();document.getElementById('pendingCount').textContent=x.filter(r=>r.status==='pending').length;document.getElementById('approvedCount').textContent=x.filter(r=>r.status==='approved').length;document.getElementById('rejectedCount').textContent=x.filter(r=>r.status==='rejected').length;document.getElementById('requestList').innerHTML=x.length?x.map(r=>`<article class="request"><div class="request-head"><h3>${safe(r.title)}</h3><span class="tag ${safe(r.status)}">${safe(r.status)}</span></div><p>${safe(r.body)}</p><div class="actions"><button class="btn success" onclick="approve(${r.id})">Approve</button><button class="btn danger" onclick="reject(${r.id})">Reject</button></div></article>`).join(''):'<div class="empty">No update requests yet.</div>'}
if(sessionStorage.getItem('sitecraft-admin-auth')==='yes')showAdmin();
document.getElementById('adminCode').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body></html>
