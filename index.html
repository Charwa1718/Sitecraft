<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitecraft</title>
<style>
:root{--blue:#4169e1;--ink:#172033;--line:#e4e9f1;--bg:#f6f8fc;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 22px}.logo{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:800}.logo img{width:38px;height:38px}.site{border:0;background:transparent;font-weight:700;color:#39465c;cursor:pointer}.right{margin-left:auto;display:flex;align-items:center;gap:8px}.version{font-size:12px;font-weight:800;color:#536176;background:#eef2ff;border:1px solid #dfe7ff;border-radius:999px;padding:5px 9px}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{background:#fff0f0;border-color:#f3c7c7;color:#a42b2b}.layout{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 65px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 14px}.side button{display:block;width:100%;margin:4px 0;padding:10px;border:1px solid transparent;border-radius:8px;background:transparent;color:#536176;cursor:pointer;text-align:left}.side button:hover,.side .active{background:var(--soft);color:var(--blue)}.new{border-color:#d7e0f0!important;color:var(--blue)!important;text-align:center!important;font-weight:700}.label{display:block;padding:14px 10px 5px;font-size:11px;color:#9aa6b8;text-transform:uppercase;font-weight:800}.main{overflow:auto}.head{height:70px;background:#fff;border-bottom:1px solid var(--line);padding:0 35px;display:flex;align-items:center}.canvas{max-width:820px;min-height:620px;margin:32px auto;background:#fff;padding:0 60px 50px;box-shadow:0 10px 30px #18233b1f}.hero{margin:0 -60px;padding:55px 60px 40px;background:linear-gradient(120deg,#edf2ff,#fbfcff);border-bottom:1px solid var(--line)}.hero h1{font-size:40px;margin:10px 0}.hero p{color:#65748b;font-size:16px}.block{padding:16px;margin:20px 0;border:1px solid transparent;border-radius:8px}.block:hover{border-color:#a9baf7;background:#fcfdff}.block p{white-space:pre-wrap;line-height:1.7;color:#59687d}.block img{max-width:100%;border-radius:8px}.block pre{white-space:pre-wrap;background:#f7f9fc;padding:14px;border:1px dashed #cdd6e4}.add{width:100%!important;text-align:center!important;border:2px dashed #d9e0ed!important;color:#8190a5!important}.modalbg{display:none;position:fixed;inset:0;background:#18233b66;place-items:center;padding:20px;z-index:5}.modalbg.open{display:grid}.modal{background:#fff;border-radius:12px;padding:24px;width:min(540px,95%);max-height:90vh;overflow:auto}.modal textarea{min-height:100px}.actions{text-align:right;margin-top:10px}.actions .btn{margin-left:6px}.toast{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 17px;border-radius:8px;z-index:10}.toast.show{display:block}@media(max-width:700px){.layout{display:block}aside{display:none}.canvas{margin:15px 10px;padding:0 25px 40px}.hero{margin:0 -25px;padding:40px 25px}.hero h1{font-size:31px}.right .version{display:none}}
</style>
</head>
<body>
<header class="top"><div class="logo"><img src="logo.svg" alt="Hammer and site">Sitecraft</div><button class="site" id="siteName" onclick="renameSite()">My first site ✎</button><div class="right"><span class="version" id="versionLabel">v27.1.2</span><button class="btn" onclick="checkForUpdate()">Check for update</button><button class="btn danger" id="updateButton" onclick="requestUpdate()" style="display:none">Update available</button><button class="btn" onclick="openSettings()" aria-label="Settings">⚙ Settings</button><button class="btn" onclick="requestIssue()">Sync</button><button class="btn primary" onclick="downloadPage()">Export HTML</button></div></header>
<div class="layout"><aside class="side"><button class="new" onclick="createPage()">＋ Create page</button><span class="label">Pages & folders</span><div id="tree"></div><button onclick="createFolder()">＋ New folder</button></aside><main class="main"><div class="head"><h2 id="title">Home</h2></div><section id="canvas" class="canvas"></section></main></div>
<div id="modal" class="modalbg"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitModal()">Save</button></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='sitecraft-data',SETTINGS_KEY='sitecraft-settings',REQUEST_KEY='sitecraft-admin-requests',APP_VERSION='27.1.2',VERSION_URL='https://raw.githubusercontent.com/Charwa1718/Sitecraft/main/sitecraft-version.json';let pendingUpdateVersion='',mode='',edit=-1;const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),data=JSON.parse(localStorage.getItem(KEY)||'null')||{site:'My first site',folders:[{name:'Pages',open:true,items:[{name:'Home',active:true,blocks:[{kind:'text',title:'Welcome to my site',body:'Create pages, photos, and text boxes.'}]}]}]};
const current=()=>data.folders.flatMap(f=>f.items||[]).find(p=>p.active)||data.folders[0].items[0];function toast(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function save(){localStorage.setItem(KEY,JSON.stringify(data));toast('Saved on this device')}
function applySettings(){let s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}');document.body.style.backgroundColor=s.backgroundColor||'#f6f8fc'}function openSettings(){openModal('Site settings','<label>Background color</label><br><input id="backgroundColor" class="input" type="color" value="'+(JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}').backgroundColor||'#f6f8fc')+'"><p class="muted">Choose the background color for Sitecraft.</p>','settings')}function saveSettings(){let color=$('backgroundColor').value;localStorage.setItem(SETTINGS_KEY,JSON.stringify({backgroundColor:color}));applySettings();toast('Background color saved')}
function versionParts(v){return String(v||'0').split('.').map(Number)}function newer(a,b){let x=versionParts(a),y=versionParts(b);for(let i=0;i<Math.max(x.length,y.length);i++)if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0);return false}
async function checkForUpdate(){try{let r=await fetch(VERSION_URL+'?t='+Date.now(),{cache:'no-store'}),j=await r.json();if(newer(j.version,APP_VERSION)){pendingUpdateVersion=j.version;$('updateButton').textContent='Update available: v'+j.version;$('updateButton').style.display='inline-block';toast('Update available')}else toast('No update available')}catch{toast('Could not check for updates')}}
function requests(){try{return JSON.parse(localStorage.getItem(REQUEST_KEY)||'[]')}catch{return[]}}function sendRequest(title,body){let x=requests();x.push({id:Date.now(),title,status:'pending',body,createdAt:new Date().toISOString()});localStorage.setItem(REQUEST_KEY,JSON.stringify(x));toast('Request sent to admin')}
function requestUpdate(){if(!pendingUpdateVersion){toast('Check for an update first');return}sendRequest('Website update request v'+pendingUpdateVersion,'Requested version: '+pendingUpdateVersion+'\nCurrent version: '+APP_VERSION+'\n\nSaved site data:\n'+JSON.stringify(data,null,2))}
function requestIssue(){let body='Website sync/upload request\n\nSite: '+data.site+'\n\n'+data.folders.flatMap(f=>f.items||[]).map(p=>'## '+p.name+'\n'+(p.blocks||[]).map(b=>b.kind==='photo'?'Photo upload: '+(b.title||'image')+'\nImage data: '+b.src:(b.title||'Block')+': '+(b.body||'')).join('\n')).join('\n\n');sendRequest('Website sync/upload request',body)}
function checkApproved(){let r=requests().find(x=>x.title==='Website update request v'+pendingUpdateVersion&&x.status==='approved');if(r){pendingUpdateVersion='';$('updateButton').style.display='none';toast('Update approved — page updated');setTimeout(()=>location.reload(),700)}}
function render(){let p=current();$('siteName').textContent=data.site+' ✎';$('title').textContent=p.name;let t=$('tree');t.innerHTML='';data.folders.forEach(f=>{let b=document.createElement('button');b.textContent=(f.open?'⌄ ':'› ')+'📁 '+f.name;b.onclick=()=>{f.open=!f.open;render()};t.append(b);if(f.open)(f.items||[]).forEach(x=>{let q=document.createElement('button');q.textContent='▤ '+x.name;q.className=x.active?'active':'';q.onclick=()=>{data.folders.flatMap(z=>z.items||[]).forEach(y=>y.active=y===x);render();save()};t.append(q)})});let c=$('canvas');c.innerHTML='<div class="hero"><h1>'+esc(p.name)+'</h1><p>Build and share your site from anywhere.</p></div>';(p.blocks||[]).forEach((b,i)=>{let e=document.createElement('article');e.className='block';e.innerHTML='<button onclick="editBlock('+i+')">Edit</button> <button onclick="removeBlock('+i+')">Delete</button>'+(b.kind==='photo'?'<img src="'+b.src+'"><p>'+esc(b.title)+'</p>':b.kind==='html'?'<pre>'+esc(b.body)+'</pre>':'<h2>'+esc(b.title)+'</h2><p>'+esc(b.body)+'</p>');c.append(e)});let a=document.createElement('button');a.className='btn add';a.textContent='＋ Add text, photo, or HTML';a.onclick=addContent;c.append(a)}
function openModal(title,body,m){mode=m;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function createPage(){openModal('Create page','<input id="name" class="input" placeholder="Page name">','page')}function createFolder(){openModal('Create folder','<input id="name" class="input" placeholder="Folder name">','folder')}
function addContent(){let x=prompt('Choose content: text, photo, or html');if(x==='photo'){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let r=new FileReader();r.onload=()=>{current().blocks.push({kind:'photo',src:r.result,title:i.files[0].name});render();save()};r.readAsDataURL(i.files[0])};i.click()}else if(x==='text'||x==='html')openModal('Add '+x,'<input id="name" class="input" placeholder="Heading"><textarea id="body" class="input" placeholder="Content"></textarea>',x)}function submitModal(){if(mode==='settings'){saveSettings();closeModal();return}let n=$('name')?.value.trim(),b=$('body')?.value.trim();if(!n)return toast('Add a name');if(mode==='page'){data.folders[0].items.push({name:n,active:false,blocks:[]});data.folders.flatMap(f=>f.items||[]).forEach(x=>x.active=x===data.folders[0].items.at(-1))}else if(mode==='folder')data.folders.push({name:n,open:true,items:[]});else if(mode==='edit')Object.assign(current().blocks[edit],{title:n,body:b});else current().blocks.push({kind:mode==='html'?'html':'text',title:n,body:b});closeModal();render();save()}function editBlock(i){edit=i;let b=current().blocks[i];openModal('Edit content','<input id="name" class="input" value="'+esc(b.title)+'"><textarea id="body" class="input">'+esc(b.body)+'</textarea>','edit')}function removeBlock(i){current().blocks.splice(i,1);render();save()}function renameSite(){let x=prompt('Site name',data.site);if(x){data.site=x;render();save()}}function downloadPage(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!doctype html><html><body>'+document.getElementById('canvas').innerHTML+'</body></html>'],{type:'text/html'}));a.download=current().name+'.html';a.click()}
applySettings();render();setInterval(checkApproved,1000);
</script></body></html>
