<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Sitecraft</title><style>body{margin:0;font:14px system-ui;color:#172033;background:#f6f8fc}.top{height:64px;background:white;border-bottom:1px solid #e4e9f1;display:flex;align-items:center;padding:0 22px;gap:16px}.logo{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px}.logo img{width:36px;height:36px}.top button,.side button,.modal button{border:1px solid #d5ddea;background:white;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.top .right{margin-left:auto}.primary{background:#4169e1!important;color:white;border-color:#4169e1!important}.layout{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 65px)}aside{background:white;border-right:1px solid #e4e9f1;padding:18px 14px}.side button{width:100%;margin:4px 0;text-align:left}.side .new{color:#4169e1;text-align:center}.side .active{background:#eef2ff;color:#4169e1}.main{overflow:auto}.head{height:70px;background:white;border-bottom:1px solid #e4e9f1;padding:0 35px;display:flex;align-items:center}.canvas{background:white;max-width:820px;min-height:620px;margin:32px auto;padding:0 60px 50px;box-shadow:0 10px 30px #18233b12}.hero{margin:0 -60px;padding:55px 60px 40px;background:linear-gradient(120deg,#edf2ff,#fbfcff);border-bottom:1px solid #e4e9f1}.hero h1{font-size:40px;margin:10px 0}.hero p{color:#65748b;font-size:16px}.block{padding:16px;margin:20px 0;border:1px solid transparent;border-radius:8px}.block:hover{border-color:#a9baf7;background:#fcfdff}.block h2{margin:0 0 8px}.block p{white-space:pre-wrap;line-height:1.7;color:#59687d}.block img{max-width:100%;border-radius:8px}.add{width:100%;padding:18px!important;text-align:center!important;border:2px dashed #d9e0ed!important;color:#8190a5}.modalbg{display:none;position:fixed;inset:0;background:#18233b66;place-items:center}.modalbg.open{display:grid}.modal{background:white;border-radius:12px;padding:24px;width:min(500px,90%)}.modal h2{margin-top:0}.modal input,.modal textarea{width:100%;padding:10px;border:1px solid #d5ddea;border-radius:8px;margin:7px 0 14px}.modal textarea{min-height:110px}.hint{color:#65748b;line-height:1.5}.actions{text-align:right}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172033;color:white;padding:11px 17px;border-radius:8px;display:none}.toast.show{display:block}@media(max-width:700px){.layout{display:block}aside{display:none}.canvas{margin:15px 10px;padding:0 25px 40px}.hero{margin:0 -25px;padding:40px 25px}.hero h1{font-size:31px}}</style></head><body><header class="top"><div class="logo"><img src="logo.svg" alt="Hammer and site">Sitecraft</div><button onclick="rename()" id="site">My first site ✎</button><div class="right"><button onclick="cloud()">☁ Save / Load anywhere</button><button class="primary" onclick="download()">Export HTML</button></div></header><div class="layout"><aside class="side"><button class="new" onclick="createPage()">＋ Create page</button><b>Pages & folders</b><div id="tree"></div><button onclick="createFolder()">＋ New folder</button></aside><main class="main"><div class="head"><h2 id="title">Home</h2></div><section class="canvas" id="canvas"></section></main></div><div class="modalbg" id="modal"><div class="modal"><h2 id="mTitle"></h2><div id="mBody"></div><div class="actions"><button onclick="closeModal()">Cancel</button> <button class="primary" onclick="submit()">Continue</button></div></div></div><div class="toast" id="toast"></div><script>const API='https://api.github.com/repos/Charwa1718/Sitecraft/contents/sitecraft-data.json',KEY='sitecraft-data';let data=JSON.parse(localStorage.getItem(KEY)||'null')||{site:'My first site',folders:[{name:'Pages',open:true,items:[{name:'Home',active:true,blocks:[{kind:'text',title:'Welcome to my site',body:'Create pages, add photos and text, then save your site to GitHub so it appears on any device.'}]}]}]},mode='',edit=-1,$=id=>document.getElementById(id),cur=()=>data.folders.flatMap(f=>f.items||[]).find(p=>p.active)||data.folders[0].items[0],esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function note(x){$('toast').textContent=x;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function saveLocal(){localStorage.setItem(KEY,JSON.stringify(data));note('Saved on this device')}function render(){let p=cur();$('site').textContent=data.site+' ✎';$('title').textContent=p.name;let t=$('tree');t.innerHTML='';data.folders.forEach(f=>{let x=document.createElement('button');x.textContent='📁 '+f.name;x.onclick=()=>{f.open=!f.open;render()};t.append(x);if(f.open)(f.items||[]).forEach(q=>{let b=document.createElement('button');b.textContent='▤ '+q.name;b.className=q.active?'active':'';b.onclick=()=>{data.folders.flatMap(z=>z.items||[]).forEach(y=>y.active=y===q);render();saveLocal()};t.append(b)})});let c=$('canvas');c.innerHTML='<div class="hero"><h1>'+esc(p.name)+'</h1><p>Build and share your site from anywhere.</p></div>';(p.blocks||[]).forEach((b,i)=>{let e=document.createElement('article');e.className='block';e.innerHTML='<div><button onclick="editBlock('+i+')">Edit</button> <button onclick="del('+i+')">Delete</button></div>'+(b.kind==='photo'?'<img src="'+b.src+'"><p>'+esc(b.title)+'</p>':b.kind==='html'?'<pre>'+esc(b.body)+'</pre>':'<h2>'+esc(b.title)+'</h2><p>'+esc(b.body)+'</p>');c.append(e)});let a=document.createElement('button');a.className='add';a.textContent='＋ Add text, photo, or HTML';a.onclick=addContent;c.append(a)}function open(title,html,m){mode=m;$('mTitle').textContent=title;$('mBody').innerHTML=html;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function createPage(){open('Create page','<input id="name" placeholder="Page name">','page')}function createFolder(){open('Create folder','<input id="name" placeholder="Folder name">','folder')}function addContent(){let x=prompt('Type text, photo, or html');if(x==='photo'){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let r=new FileReader();r.onload=()=>{cur().blocks.push({kind:'photo',src:r.result,title:i.files[0].name});render();saveLocal()};r.readAsDataURL(i.files[0])};i.click()}else if(x==='text'||x==='html')open('Add '+x,'<input id="name" placeholder="Heading"><textarea id="body" placeholder="Content"></textarea>',x);else note('Choose text, photo, or html')}function submit(){let n=$('name')?.value.trim(),b=$('body')?.value.trim();if(mode==='page'){data.folders[0].items.push({name:n,active:false,blocks:[]});data.folders.flatMap(f=>f.items||[]).forEach(x=>x.active=x===data.folders[0].items.at(-1))}else if(mode==='folder')data.folders.push({name:n,open:true,items:[]});else if(mode==='edit'){Object.assign(cur().blocks[edit],{title:n,body:b})}else cur().blocks.push({kind:mode==='html'?'html':'text',title:n,body:b});closeModal();render();saveLocal()}function editBlock(i){edit=i;let b=cur().blocks[i];open('Edit content','<input id="name" value="'+esc(b.title)+'"><textarea id="body">'+esc(b.body)+'</textarea>','edit')}function del(i){cur().blocks.splice(i,1);render();saveLocal()}function rename(){let x=prompt('Site name',data.site);if(x){data.site=x;render();saveLocal()}}function html(){let p=cur();return '<!doctype html><html><body><h1>'+esc(p.name)+'</h1>'+p.blocks.map(b=>b.kind==='photo'?'<img src="'+b.src+'">':b.kind==='html'?b.body:'<h2>'+esc(b.title)+'</h2><p>'+esc(b.body)+'</p>').join('')+'</body></html>'}function download(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html()],{type:'text/html'}));a.download=cur().name+'.html';a.click()}function cloud(){open('Cloud save and load','<p class="hint">Your site data is stored in <b>Charwa1718/Sitecraft</b> as <b>sitecraft-data.json</b>. Load it on any device. A token is only needed to save and is never stored.</p><input id="token" type="password" placeholder="GitHub fine-grained token"><button onclick="loadCloud()">Load from GitHub</button> <button class="primary" onclick="saveCloud()">Save to GitHub</button>','cloud')}async function loadCloud(){let r=await fetch(API);if(!r.ok)return note('No cloud save found yet');let j=await r.json();data=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));saveLocal();closeModal();render();note('Loaded on this device')}async function saveCloud(){let token=$('token').value.trim();if(!token)return note('Enter a GitHub token');let h={Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},old=await fetch(API,{headers:h}),body={message:'Save Sitecraft site data',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))))};if(old.ok)body.sha=(await old.json()).sha;let r=await fetch(API,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!r.ok)return note((await r.json()).message||'Save failed');closeModal();note('Saved to GitHub — available on any device')}render();</script></body></html>
