<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitecraft</title>
<style>
:root{--blue:#4169e1;--ink:#172033;--line:#e4e9f1;--bg:#f6f8fc;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#f3f6ff,#eef2ff 35%,#f6f8fc 100%);color:var(--ink);font:14px system-ui,sans-serif}.lock{display:grid;place-items:center;min-height:100vh;padding:20px}.panel{width:min(500px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 50px rgba(23,32,51,.12);padding:28px}.logo{display:flex;align-items:center;gap:12px;font-size:18px;font-weight:800;margin-bottom:18px}.logo img{width:38px;height:38px}.panel h1{margin:0 0 6px;font-size:26px}.sub{margin:0 0 18px;color:#64748b}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:700;color:#536176;margin-bottom:7px}.field input{width:100%;padding:10px 12px;border:1px solid #d7dfeb;border-radius:8px;font-size:15px}.field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(65,105,225,.14)}.btn{display:block;width:100%;padding:12px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.error{min-height:20px;color:#c62828;font-weight:700;margin-top:10px}.hidden{display:none}.app{display:none}.app.show{display:block}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:16px}.logo-mini{font-size:18px;font-weight:800;display:flex;align-items:center;gap:9px}.logo-mini img{width:34px;height:34px}.site{border:0;background:transparent;font-weight:700;color:#39465c;padding:9px;cursor:pointer}.right{margin-left:auto;display:flex;gap:8px}.btn-lite{border:1px solid #d5ddea;background:#fff;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.layout{display:grid;grid-template-columns:250px 1fr;height:calc(100vh - 65px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 14px;overflow:auto}.side button{width:100%;margin:4px 0;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:9px;cursor:pointer;color:#536176}.side button:hover,.side .active{background:var(--soft);color:var(--blue)}.side .new{text-align:center;border-color:#d7e0f0;color:var(--blue);font-weight:700}.label{display:block;font-size:11px;color:#9aa6b8;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:12px 10px 5px}.main{overflow:auto}.head{height:70px;background:#fff;border-bottom:1px solid var(--line);padding:0 35px;display:flex;align-items:center}.canvas{background:#fff;max-width:820px;min-height:620px;margin:32px auto;padding:0 60px 50px;box-shadow:0 10px 30px rgba(24,35,59,.12)}.hero{margin:0 -60px;padding:55px 60px 40px;background:linear-gradient(120deg,#edf2ff,#fbfcff);border-bottom:1px solid var(--line)}.hero h1{font-size:40px;margin:10px 0}.hero p{color:#65748b;font-size:16px}.block{padding:16px;margin:20px 0;border:1px solid transparent;border-radius:8px}.block:hover{border-color:#a9baf7;background:#fcfdff}.block h2{margin:0 0 8px}.block p{white-space:pre-wrap;line-height:1.7;color:#59687d}.block img{max-width:100%;border-radius:8px}.block pre{white-space:pre-wrap;background:#f7f9fc;padding:14px;border:1px dashed #cdd6e4}.add{width:100%;padding:18px!important;text-align:center!important;border:2px dashed #d9e0ed!important;color:#8190a5!important}.modalbg{display:none;position:fixed;inset:0;background:#18233b66;place-items:center;z-index:5;padding:20px}.modalbg.open{display:grid}.modal{background:#fff;border-radius:12px;padding:24px;width:min(540px,95%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.modal input,.modal textarea{width:100%;padding:10px;border:1px solid #d5ddea;border-radius:8px;margin:7px 0 14px}.modal textarea{min-height:100px}.hint{color:#65748b;line-height:1.5}.modal-actions{text-align:right}.modal-actions .btn-lite{margin-left:6px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 17px;border-radius:8px;display:none}.toast.show{display:block}.secret{display:none}@media(max-width:700px){.layout{display:block}aside{display:none}.canvas{margin:15px 10px;padding:0 25px 40px}.hero{margin:0 -25px;padding:40px 25px}.hero h1{font-size:31px}.right .btn-lite:first-child{display:none}}</style></head><body>
<div id="loginScreen" class="lock"><div class="panel"><div class="logo"><img src="logo.svg" alt="Hammer and site">Sitecraft</div><h1>Access required</h1><p class="sub">Type <b>Bypass</b> to continue.</p><div class="field"><label>Passcode</label><input id="pass" type="password" placeholder="Type Bypass" /></div><button class="btn" onclick="unlock()">Enter</button><div id="error" class="error"></div></div></div>
<div id="appScreen" class="app"><header class="top"><div class="logo-mini"><img src="logo.svg" alt="Hammer and site">Sitecraft</div><button class="site" id="siteName" onclick="renameSite()">My first site ✎</button><div class="right"><button class="btn-lite" onclick="openCloud()">☁ Save / Sync</button><button class="btn-lite primary" onclick="downloadPage()">Export HTML</button></div></header><div class="layout"><aside class="side"><button class="new" onclick="createPage()">＋ Create page</button><span class="label">Pages & folders</span><div id="tree"></div><button onclick="createFolder()">＋ New folder</button></aside><main class="main"><div class="head"><h2 id="title">Home</h2></div><section class="canvas" id="canvas"></section></main></div></div>
<div class="modalbg" id="modal"><div class="modal"><h2 id="modalTitle"></h2><div id="modalBody"></div><div class="modal-actions"><button class="btn-lite" onclick="closeModal()">Cancel</button><button class="btn-lite primary" onclick="submitModal()">Continue</button></div></div></div><div class="toast" id="toast"></div>
<script>
const API='https://api.github.com/repos/Charwa1718/Sitecraft/contents/',DATA_FILE='sitecraft-data.json',LOCAL='sitecraft-data';let data=JSON.parse(localStorage.getItem(LOCAL)||'null')||{site:'My first site',folders:[{name:'Pages',open:true,items:[{name:'Home',active:true,blocks:[{kind:'text',title:'Welcome to my site',body:'Create pages, photos, and text boxes, then save or sync them to GitHub.'}]}]}]},mode='',edit=-1,$=id=>document.getElementById(id),current=()=>data.folders.flatMap(f=>f.items||[]).find(p=>p.active)||data.folders[0].items[0],esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function unlock(){let v=$('pass').value.trim();if(v==='Bypass'){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.add('show');render();}else {$('error').textContent='Incorrect passcode';$('pass').value=''}}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}function localSave(){localStorage.setItem(LOCAL,JSON.stringify(data));toast('Saved on this device')}function render(){let p=current();$('siteName').textContent=data.site+' ✎';$('title').textContent=p.name;let t=$('tree');t.innerHTML='';data.folders.forEach(f=>{let b=document.createElement('button');b.textContent=(f.open?'⌄ ':'› ')+'📁 '+f.name;b.onclick=()=>{f.open=!f.open;render()};t.append(b);if(f.open)(f.items||[]).forEach(x=>{let q=document.createElement('button');q.textContent='▤ '+x.name;q.className=x.active?'active':'';q.onclick=()=>{data.folders.flatMap(z=>z.items||[]).forEach(y=>y.active=y===x);render();localSave()};t.append(q)})});let c=$('canvas');c.innerHTML='<div class="hero"><h1>'+esc(p.name)+'</h1><p>Build and share your site from anywhere.</p></div>';for(const [i,b] of (p.blocks||[]).entries()){let e=document.createElement('article');e.className='block';e.innerHTML='<button onclick="editBlock('+i+')">Edit</button> <button onclick="removeBlock('+i+')">Delete</button>'+(b.kind==='photo'?'<img src="'+b.src+'"><p>'+esc(b.title)+'</p>':b.kind==='html'?'<pre>'+esc(b.body)+'</pre>':'<h2>'+esc(b.title)+'</h2><p>'+esc(b.body)+'</p>');c.append(e)}let a=document.createElement('button');a.className='add';a.textContent='＋ Add text, photo, or HTML';a.onclick=addContent;c.append(a)}function openModal(title,body,m){mode=m;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('open')}function closeModal(){$('modal').classList.remove('open')}function createPage(){openModal('Create page','<input id="name" placeholder="Page name">','page')}function createFolder(){openModal('Create folder','<input id="name" placeholder="Folder name">','folder')}function addContent(){let x=prompt('Type text, photo, or html');if(x==='photo'){let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{let r=new FileReader();r.onload=()=>{current().blocks.push({kind:'photo',src:r.result,title:i.files[0].name});render();localSave()};r.readAsDataURL(i.files[0])};i.click()}else if(x==='text'||x==='html')openModal('Add '+x,'<input id="name" placeholder="Heading"><textarea id="body" placeholder="Content"></textarea>',x);else toast('Choose text, photo, or html')}function submitModal(){let n=$('name')?.value.trim(),b=$('body')?.value.trim();if(!n)return toast('Add a name');if(mode==='page'){data.folders[0].items.push({name:n,active:false,blocks:[]});data.folders.flatMap(f=>f.items||[]).forEach(x=>x.active=x===data.folders[0].items.at(-1))}else if(mode==='folder')data.folders.push({name:n,open:true,items:[]});else if(mode==='edit')Object.assign(current().blocks[edit],{title:n,body:b});else current().blocks.push({kind:mode==='html'?'html':'text',title:n,body:b});closeModal();render();localSave()}function editBlock(i){edit=i;let b=current().blocks[i];openModal('Edit content','<input id="name" value="'+esc(b.title)+'"><textarea id="body">'+esc(b.body)+'</textarea>','edit')}function removeBlock(i){current().blocks.splice(i,1);render();localSave()}function renameSite(){let x=prompt('Site name',data.site);if(x){data.site=x;render();localSave()}}function pageHtml(p=current()){return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>'+esc(data.site)+'</title><style>body{font:16px system-ui;max-width:800px;margin:60px auto;padding:20px;line-height:1.7}img{max-width:100%}</style></head><body><h1>'+esc(p.name)+'</h1>'+(p.blocks||[]).map(b=>b.kind==='photo'?'<figure><img src="'+b.src+'"><figcaption>'+esc(b.title)+'</figcaption></figure>':b.kind==='html'?b.body:'<h2>'+esc(b.title)+'</h2><p>'+esc(b.body)+'</p>').join('')+'</body></html>'}function downloadPage(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pageHtml()],{type:'text/html'}));a.download=current().name+'.html';a.click()}function openCloud(){openModal('Save and sync to GitHub','<p class="hint">The token is only used for GitHub writes and is never stored. Use a custom file name for the selected page or sync all pages.</p><input id="token" type="password" placeholder="GitHub token"><input id="filename" value="sites/'+current().name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html"><div class="cloud-actions"><button class="btn-lite" onclick="loadCloud()">Load site data</button><button class="btn-lite" onclick="saveSelected()">Save selected page</button><button class="btn-lite primary" onclick="syncAll()">Sync all pages</button></div>','cloud')}function headers(token){return{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'}}function encoded(x){return btoa(unescape(encodeURIComponent(x)))}async function saveSelected(){let token=$('token').value.trim(),path=$('filename').value.trim();if(!token||!path)return toast('Token and file name are required');try{let h=headers(token),req=await fetch(API+path,{headers:h}),body={message:'Save Sitecraft page: '+current().name,content:encoded(pageHtml())};if(req.ok)body.sha=(await req.json()).sha;let r=await fetch(API+path,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.message||'Save failed')}closeModal();toast('Saved selected page to GitHub')}catch(e){toast(e.message)}}async function syncAll(){let token=$('token').value.trim();if(!token)return toast('Enter a GitHub token');try{let h=headers(token),siteBody={message:'Sync Sitecraft site data',content:encoded(JSON.stringify(data,null,2))},siteReq=await fetch(API+DATA_FILE,{headers:h});if(siteReq.ok)siteBody.sha=(await siteReq.json()).sha;let siteRes=await fetch(API+DATA_FILE,{method:'PUT',headers:h,body:JSON.stringify(siteBody)});if(!siteRes.ok){let j=await siteRes.json().catch(()=>({}));throw Error(j.message||'Site data sync failed')}for(const folder of data.folders)for(const p of folder.items||[]){let path='sites/'+p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html';let pageReq=await fetch(API+path,{headers:h}),body={message:'Sync Sitecraft page: '+p.name,content:encoded(pageHtml(p))};if(pageReq.ok)body.sha=(await pageReq.json()).sha;let pageRes=await fetch(API+path,{method:'PUT',headers:h,body:JSON.stringify(body)});if(!pageRes.ok){let j=await pageRes.json().catch(()=>({}));throw Error(j.message||'Page sync failed')}}closeModal();toast('Synced all pages to GitHub')}catch(e){toast(e.message)}}async function loadCloud(){try{let r=await fetch(API+DATA_FILE+'?v='+Date.now(),{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('No cloud site data found yet');let j=await r.json();data=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));localSave();closeModal();render();toast('Loaded from GitHub')}catch(e){toast(e.message)}}</script></body></html>
