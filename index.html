<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sitecraft</title>
<style>
:root{--ink:#172033;--blue:#4169e1;--line:#e4e9f1;--bg:#f6f8fc;--soft:#eef2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif}.app{height:100vh;display:grid;grid-template-rows:64px 1fr;overflow:hidden}.top{display:flex;align-items:center;gap:22px;padding:0 22px;background:#fff;border-bottom:1px solid var(--line)}.logo{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:#fff;background:linear-gradient(135deg,#4169e1,#825cf6)}.site{border:0;background:transparent;font-weight:700;color:#39465c;padding:9px;border-radius:8px}.site:hover{background:var(--bg)}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:1px solid #d5ddea;border-radius:8px;padding:9px 15px;background:#fff;font-weight:700;cursor:pointer}.btn:hover{transform:translateY(-1px)}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.layout{display:grid;grid-template-columns:255px 1fr;min-height:0}.sidebar{background:#fff;border-right:1px solid var(--line);padding:20px 14px;overflow:auto}.new,.add,.addblock{width:100%;padding:11px;border-radius:8px;cursor:pointer;font-weight:700}.new{border:1px solid #d7e0f0;color:var(--blue);background:#fbfcff;margin-bottom:24px}.add{margin-top:18px;border:1px dashed #cbd5e1;background:#fff;color:#64748b}.label{font-size:11px;color:#9aa6b8;letter-spacing:.08em;text-transform:uppercase;font-weight:800;padding:0 10px 8px}.tree{width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:7px;color:#536176;cursor:pointer;margin:2px 0;display:block}.tree:hover{background:#f2f5fa}.tree.active{background:var(--soft);color:var(--blue);font-weight:750}.indent{padding-left:31px}.main{overflow:auto}.head{height:72px;background:#fff;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center}.crumb{font-size:12px;color:#9aa6b8;margin-bottom:5px}.head h1{font-size:19px;margin:0}.wrap{padding:34px 42px 70px}.canvas{max-width:840px;min-height:620px;margin:auto;background:#fff;border:1px solid #e1e7f0;border-radius:12px;box-shadow:0 12px 35px #18233b12;overflow:hidden}.hero{padding:55px 65px 42px;background:linear-gradient(120deg,#edf2ff,#fbfcff 65%,#f3efff);border-bottom:1px solid #e7ebf5}.hero h2{font-size:40px;line-height:1.1;margin:12px 0}.hero p{color:#59687d;line-height:1.7;font-size:16px;margin:0}.content{padding:34px 65px}.block{position:relative;padding:15px 16px;margin:0 -16px 18px;border:1px solid transparent;border-radius:9px}.block:hover{border-color:#a9baf7;background:#fcfdff}.block h3{font-size:22px;margin:0 0 7px}.block p{color:#59687d;line-height:1.7;margin:0;white-space:pre-wrap}.block img{max-width:100%;max-height:420px;border-radius:8px;display:block}.tools{position:absolute;right:8px;top:-15px;display:none;background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px}.block:hover .tools{display:flex}.tools button{border:0;background:transparent;padding:4px 7px;cursor:pointer}.html{padding:14px;background:#f7f9fc;border:1px dashed #cdd6e4;white-space:pre-wrap;font:12px monospace}.addblock{border:2px dashed #d9e0ed;background:#fff;color:#8190a5}.empty{text-align:center;padding:100px 20px;color:#8491a5}.modal-bg{display:none;position:fixed;inset:0;background:#18233b55;place-items:center;padding:20px;z-index:5}.modal-bg.open{display:grid}.modal{width:min(520px,100%);background:#fff;border-radius:13px;padding:24px;box-shadow:0 20px 60px #18233b33}.modaltop{display:flex;justify-content:space-between;margin-bottom:18px}.modal h2{margin:0;font-size:19px}.close{border:0;background:none;font-size:22px;color:#9aa6b8;cursor:pointer}.field{margin:14px 0}.field label{display:block;font-size:12px;font-weight:750;color:#536176;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #d7dfeb;border-radius:8px;padding:10px;outline:0}.field textarea{min-height:110px;resize:vertical}.hint{font-size:12px;color:#718096;line-height:1.5}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#172033;color:#fff;padding:11px 17px;border-radius:8px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:700px){.layout{grid-template-columns:1fr}.sidebar{display:none}.wrap{padding:18px 12px}.hero{padding:40px 28px}.hero h2{font-size:31px}.content{padding:25px 28px}.head{padding:0 18px}.actions .btn:first-child{display:none}}
</style></head>
<body><div class="app"><header class="top"><div class="logo"><span class="mark">S</span>Sitecraft</div><button class="site" id="siteName" onclick="renameSite()">My first site ✎</button><div class="actions"><button class="btn" onclick="openGitHub()">Save to GitHub</button><button class="btn primary" onclick="downloadPage()">Export HTML</button></div></header><div class="layout"><aside class="sidebar"><button class="new" onclick="openModal('page')">＋ Create page</button><div class="label">Pages & folders</div><div id="tree"></div><button class="add" onclick="openModal('folder')">＋ New folder</button></aside><main class="main"><div class="head"><div><div class="crumb">My first site / Pages</div><h1 id="pageTitle">Home</h1></div></div><div class="wrap"><section class="canvas" id="canvas"></section></div></main></div></div><div class="modal-bg" id="modal"><div class="modal"><div class="modaltop"><h2 id="modalTitle">Create page</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalFields"></div><div class="modalactions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitModal()">Continue</button></div></div></div><div class="toast" id="toast"></div>
<script>
const starter={site:'My first site',folders:[{name:'Pages',open:true,items:[{name:'Home',active:true,blocks:[{kind:'text',title:'Welcome to my site',body:'Create pages, upload photos, and add text boxes. Your work is saved in the browser and can be published to GitHub.'}]}]}]};let data=JSON.parse(localStorage.getItem('sitecraft')||'null')||starter,type='',edit=-1;const $=x=>document.getElementById(x);const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function page(){return data.folders.flatMap(f=>f.items||[]).find(p=>p.active)||data.folders[0].items[0]}function save(){localStorage.setItem('sitecraft',JSON.stringify(data));notice('Saved in this browser')}function notice(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1900)}function render(){let p=page();$('siteName').textContent=data.site+' ✎';$('pageTitle').textContent=p.name;let t=$('tree');t.innerHTML='';data.folders.forEach(f=>{let b=document.createElement('button');b.className='tree';b.textContent=(f.open?'⌄ ':'› ')+'📁 '+f.name;b.onclick=()=>{f.open=!f.open;render()};t.append(b);if(f.open)(f.items||[]).forEach(x=>{let q=document.createElement('button');q.className='tree indent '+(x.active?'active':'');q.textContent='▤ '+x.name;q.onclick=()=>{data.folders.flatMap(z=>z.items||[]).forEach(y=>y.active=y===x);render();save()};t.append(q)})});let c=$('canvas');c.innerHTML='<div class="hero"><h2>'+esc(p.name)+'</h2><p>Build a site that feels like you. Add content below.</p></div><div class="content"></div>';let con=c.querySelector('.content');(p.blocks||[]).forEach((b,i)=>{let e=document.createElement('article');e.className='block';e.innerHTML='<div class="tools"><button onclick="editBlock('+i+')">✎</button><button onclick="removeBlock('+i+')">⌫</button></div>'+(b.kind==='photo'?'<img src="'+b.src+'" alt="'+esc(b.title)+'"><p>'+esc(b.title)+'</p>':b.kind==='html'?'<div class="html">'+esc(b.body)+'</div>':'<h3>'+esc(b.title)+'</h3><p>'+esc(b.body)+'</p>');con.append(e)});let add=document.createElement('button');add.className='addblock';add.textContent='＋ Add content';add.onclick=()=>chooseContent();con.append(add)}function openModal(t){type=t;edit=-1;$('modalTitle').textContent=t==='page'?'Create page':t==='folder'?'Create folder':'Add content';$('modalFields').innerHTML=t==='folder'?'<div class="field"><label>Folder name</label><input id="name" placeholder="e.g. Projects"></div>': '<div class="field"><label>Name / heading</label><input id="name" placeholder="e.g. About us"></div><div class="field"><label>Text or HTML</label><textarea id="body" placeholder="Write something…"></textarea></div>';$('modal').classList.add('open');$('name').focus()}function closeModal(){$('modal').classList.remove('open')}function chooseContent(){let v=prompt('What do you want to add? Type text, photo, or html.');if(!v)return;v=v.toLowerCase().trim();if(v==='photo'){let input=document.createElement('input');input.type='file';input.accept='image/*';input.onchange=()=>{let r=new FileReader();r.onload=()=>{page().blocks.push({kind:'photo',title:input.files[0].name,src:r.result});render();save()};r.readAsDataURL(input.files[0])};input.click()}else if(['text','html'].includes(v)){openModal(v);$('modalTitle').textContent='Add '+v}else notice('Please choose text, photo, or html')}function submitModal(){let n=$('name')?.value.trim(),b=$('body')?.value.trim();if(type==='folder'){if(!n)return notice('Add a folder name');data.folders.push({name:n,open:true,items:[]})}else if(type==='page'){if(!n)return notice('Add a page name');data.folders[0].items.push({name:n,active:false,blocks:[]});let p=data.folders[0].items.at(-1);data.folders.flatMap(f=>f.items||[]).forEach(x=>x.active=x===p)}else if(type==='edit'){let x=page().blocks[edit];x.title=n;x.body=b}else page().blocks.push({kind:type==='html'?'html':'text',title:n,body:b});closeModal();render();save()}function editBlock(i){type='edit';edit=i;let b=page().blocks[i];$('modalTitle').textContent='Edit content';$('modalFields').innerHTML='<div class="field"><label>Heading</label><input id="name" value="'+esc(b.title)+'"></div><div class="field"><label>Content</label><textarea id="body">'+esc(b.body)+'</textarea></div>';$('modal').classList.add('open')}function removeBlock(i){if(confirm('Delete this content?')){page().blocks.splice(i,1);render();save()}}function renameSite(){let n=prompt('Name your site:',data.site);if(n?.trim()){data.site=n.trim();render();save()}}function pageHtml(){let p=page();return '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>'+esc(data.site)+'</title><style>body{font:16px system-ui;max-width:800px;margin:60px auto;padding:20px;line-height:1.7}img{max-width:100%}</style></head><body><h1>'+esc(p.name)+'</h1>'+(p.blocks||[]).map(b=>b.kind==='photo'?'<figure><img src="'+b.src+'"><figcaption>'+esc(b.title)+'</figcaption></figure>':b.kind==='html'?b.body:'<h2>'+esc(b.title)+'</h2><p>'+esc(b.body)+'</p>').join('')+'</body></html>'}function downloadPage(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([pageHtml()],{type:'text/html'}));a.download=page().name.toLowerCase().replace(/\s+/g,'-')+'.html';a.click();notice('HTML exported')}
function openGitHub(){ $('modalTitle').textContent='Save site to GitHub';$('modalFields').innerHTML='<p class="hint">This saves the current page directly to <b>Charwa1718/Sitecraft</b>. Create a GitHub fine-grained token with Contents: Read and write permission. Your token is used only for this save and is not stored.</p><div class="field"><label>GitHub token</label><input id="token" type="password" placeholder="github_pat_…"></div><div class="field"><label>File name</label><input id="filename" value="sites/'+page().name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.html"></div>';$('modal').classList.add('open');type='github'}async function githubSave(){let token=$('token').value.trim(),path=$('filename').value.trim();if(!token||!path)return notice('Token and file name are required');let content=btoa(unescape(encodeURIComponent(pageHtml()))),url='https://api.github.com/repos/Charwa1718/Sitecraft/contents/'+path;let existing=await fetch(url,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});let body={message:'Save site page: '+page().name,content};if(existing.ok){let old=await existing.json();body.sha=old.sha}let res=await fetch(url,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok){let e=await res.json().catch(()=>({}));return notice(e.message||'GitHub save failed')}closeModal();notice('Saved to GitHub')}let oldSubmit=submitModal;submitModal=function(){if(type==='github')return githubSave();oldSubmit()};render();
</script></body></html>
